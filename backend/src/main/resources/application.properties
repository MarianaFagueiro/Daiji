spring.application.name=daiji
db.url=${ORACLE_URL}
db.user=${ORACLE_USER}
db.password=${ORACLE_PASSWORD}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.poll-timeout-seconds=${TELEGRAM_BOT_POLL_TIMEOUT_SECONDS:25}
gemini.enabled=${GEMINI_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:12}
